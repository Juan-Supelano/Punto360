server {
    # Cloud Run enruta al puerto 8080 del contenedor.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos de /assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea, si no el navegador sigue pidiendo el bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router maneja las rutas en el cliente: cualquier ruta desconocida
    # devuelve index.html en lugar de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
